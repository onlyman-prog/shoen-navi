<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>荘園ナビ</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css?v=20261116">
</head>
<body>
<header>
  <nav id="tabs">
    <button data-tab="s" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.8 3.6-5.8 7-5.8s6.2 2 7 5.8"/></svg><span>サバ</span></button>
    <button data-tab="h"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l2.2 4.4M18 4l-2.2 4.4"/><path d="M7.5 9.5h9l-1 6.5-3.5 3.5-3.5-3.5z"/><path d="M10 13h.01M14 13h.01"/></svg><span>ハンター</span></button>
    <button data-tab="m"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5l5.5-2 6 2 5.5-2v13l-5.5 2-6-2-5.5 2z"/><path d="M9 4.5v13M15 6.5v13"/></svg><span>マップ</span></button>
    <button data-tab="pl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg><span>地名</span></button>
    <button data-tab="ban"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M6.4 6.4l11.2 11.2"/></svg><span>BAN予測</span></button>
  </nav>
  <div class="tools">
    <button id="pin" title="最前面に固定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 5 3 3v1.5H7V12l3-3z"/><path d="M12 13.5V20"/></svg></button>
    <button id="reload" title="最新情報を取得"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 4.5V8h-3.5"/></svg></button>
  </div>
  <div id="bar"><i></i></div>
</header>

<div id="filters">
  <input id="q" type="search" placeholder="検索" autocomplete="off">
  <div id="tiers"></div>
</div>

<main id="list"></main>

<section id="detail" hidden>
  <div class="dhead">
    <button id="back" title="戻る (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
    <div id="dtitle"></div>
  </div>
  <div id="dbody"></div>
</section>

<div id="zoom" hidden><img alt=""></div>
<div id="mapzoom" hidden><button class="mzclose" aria-label="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="mzscroll"></div></div>

<section id="calib-view" hidden>
  <div class="dhead">
    <button id="calclose" title="閉じる (Esc)">‹</button>
    <div class="nm">読み取り設定</div>
  </div>
  <div class="calbody">
    <p class="none">通常は設定不要です（ランク戦の試合前画面の文字を自動で読みます）。うまく読めない場合だけ、BANカードの位置を手動で囲んでください。ゲーム画面は大きめ（横1280以上）が確実です。</p>
    <ol class="steps">
      <li>下の自動スクショからBAN画面を選ぶ（または今の画面を「撮影」）</li>
      <li>BANされたキャラを1枠ずつドラッグで囲む</li>
      <li>「テスト」で確認 →「保存」</li>
    </ol>
    <div class="lbl">最近の自動スクショ <button id="shotsreload" class="mini">更新</button></div>
    <div id="shots" class="shots"></div>
    <div class="calbtns">
      <button id="calshot">📷 撮影</button>
      <button id="calundo">1つ戻す</button>
      <button id="caltest">テスト</button>
      <button id="calsave" class="pri">保存</button>
    </div>
    <canvas id="calcv"></canvas>
    <pre id="calmsg"></pre>
    <label class="opt"><input type="checkbox" id="gameicons"> ゲーム内のキャラ画像を使う（キャラ選択画面から自動で収集・<span id="iconstat">-</span>）</label>
    <label class="opt"><input type="checkbox" id="autoshot"> ゲーム中、画面が切り替わったら自動スクショ</label>
    <label class="opt"><input type="checkbox" id="autoread"> ゲーム中は自動で読み取る（F8で手動読取）</label>
    <p class="none">使うほど賢くなります：記録するたびに、その時の画面の見た目を学習します。撮影画像は data/captures に保存されます。</p>
  </div>
</section>

<div id="toast" hidden></div>

<footer id="status"></footer>

<script src="app.js?v=20261116"></script>
</body>
</html>
